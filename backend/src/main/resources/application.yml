spring:
  profiles:
    active: dev
  application:
    name: contest-agent-platform
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT_MS:5000}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:3}
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8080

app:
  mail:
    from: ${MAIL_FROM:no-reply@contest-agent-platform.local}
    queue:
      exchange: ${MAIL_OTP_EXCHANGE:auth.otp.exchange}
      routing-key: ${MAIL_OTP_ROUTING_KEY:auth.otp.send}
      send-queue: ${MAIL_OTP_SEND_QUEUE:auth.otp.send.queue}
      retry-queue: ${MAIL_OTP_RETRY_QUEUE:auth.otp.retry.queue}
      dead-letter-queue: ${MAIL_OTP_DLQ:auth.otp.dlq}
      retry-delay-ms: ${MAIL_OTP_RETRY_DELAY_MS:30000}
      max-retries: ${MAIL_OTP_MAX_RETRIES:3}
      message-ttl-ms: ${MAIL_OTP_MESSAGE_TTL_MS:300000}
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:}
      issuer: ${AUTH_JWT_ISSUER:contest-agent-platform}
      access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

storage:
  # local：本地磁盘；seaweedfs：SeaweedFS 对象存储
  type: seaweedfs
  root: D:/codex/storage
  seaweedfs:
    endpoint: http://127.0.0.1:8333
    bucket: contest-files
    region: us-east-1
    # 本地 SeaweedFS 未开启身份认证时留空，使用匿名连接
    access-key:
    secret-key:
    temp-dir: D:/codex/storage/seaweed-temp
