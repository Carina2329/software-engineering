<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文件存储测试 · 大文件分片上传</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; color: #222; }
    h1 { font-size: 20px; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-width: 960px; }
    .row { margin: 12px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { padding: 7px 16px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
    button:disabled { background: #9bb3e8; cursor: not-allowed; }
    button.ghost { background: #eef1f6; color: #333; }
    .bar { height: 18px; background: #eef1f6; border-radius: 9px; overflow: hidden; flex: 1; min-width: 240px; }
    .bar > div { height: 100%; width: 0; background: #2f6fed; transition: width .2s; }
    .stat { font-size: 13px; color: #555; }
    .hint { color: #666; font-size: 13px; }
    .ok { color: #1a7f37; }
    .fail { color: #c62828; }
    .warn { color: #b42318; font-size: 13px; }
    #log { background: #1e1e1e; color: #d4d4d4; font-family: Consolas, monospace; font-size: 12px;
           padding: 12px; border-radius: 6px; height: 240px; overflow-y: auto; margin-top: 16px; }
    #log div { margin: 2px 0; }
    a { color: #2f6fed; }
  </style>
</head>
<body>
  <h1>文件存储测试 · 大文件分片上传与断点续传</h1>
  <div class="box">
    <p class="hint">
      流程：选择文件 → 计算 SHA-256（秒传判断）→ 初始化上传 → 分片上传 → 暂停/继续 → 合并 → 校验 → 下载。
      刷新页面后，如果上次任务没传完，页面上会显示它；重新选择同一个文件即可续传。
      勾选“模拟坏片”后，第 2 个分片会先被服务端判定校验失败，页面随后自动重传。
    </p>

    <div class="row">
      <input type="file" id="file">
      <label class="stat">分片大小：
        <select id="chunkSize">
          <option value="1048576" selected>1 MB</option>
          <option value="2097152">2 MB</option>
          <option value="5242880">5 MB</option>
        </select>
      </label>
      <label class="stat">
        <input type="checkbox" id="simulateCorrupt">
        模拟第 2 片损坏一次
      </label>
    </div>

    <div class="row">
      <button id="start" type="button" disabled>开始上传</button>
      <button id="pause" class="ghost" type="button" disabled>暂停</button>
      <button id="resumeBtn" class="ghost" type="button" disabled>刷新后续传</button>
      <button id="mergeBtn" class="ghost" type="button" disabled>合并分片</button>
      <button id="clearBtn" class="ghost" type="button">重置 / 放弃任务</button>
    </div>

    <div class="row">
      <div class="bar"><div id="progress"></div></div>
      <span class="stat" id="progressText">等待上传</span>
    </div>

    <div class="row">
      <span class="stat" id="taskText">uploadId：-</span>
    </div>

    <div class="row">
      <span class="warn" id="resumeHint"></span>
    </div>

    <div class="row" id="resultRow" style="display:none">
      <span class="stat" id="resultText"></span>
      <a id="downloadLink" href="#" target="_blank">下载合并结果</a>
    </div>

    <div class="row" id="downloadButtons" style="display:none">
      <button id="downloadProgressBtn" type="button">开始 / 继续下载</button>
      <button id="pauseDownloadBtn" class="ghost" type="button" disabled>暂停下载</button>
      <button id="concurrentBtn" class="ghost" type="button">三路并发下载测试</button>
      <button id="resetDownloadBtn" class="ghost" type="button">重置下载</button>
    </div>

    <div class="row" id="downloadProgressRow" style="display:none">
      <div class="bar"><div id="downloadBar"></div></div>
      <span class="stat" id="downloadText">等待下载</span>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const API = '/api/v1';
    const storeKey = 'big-upload-task';

    const fileInput = document.getElementById('file');
    const chunkSelect = document.getElementById('chunkSize');
    const simulateCorrupt = document.getElementById('simulateCorrupt');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');
    const resumeBtn = document.getElementById('resumeBtn');
    const mergeBtn = document.getElementById('mergeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const bar = document.getElementById('progress');
    const progressText = document.getElementById('progressText');
    const taskText = document.getElementById('taskText');
    const resumeHint = document.getElementById('resumeHint');
    const resultRow = document.getElementById('resultRow');
    const resultText = document.getElementById('resultText');
    const downloadLink = document.getElementById('downloadLink');
    const downloadButtons = document.getElementById('downloadButtons');
    const downloadProgressRow = document.getElementById('downloadProgressRow');
    const downloadProgressBtn = document.getElementById('downloadProgressBtn');
    const pauseDownloadBtn = document.getElementById('pauseDownloadBtn');
    const concurrentBtn = document.getElementById('concurrentBtn');
    const resetDownloadBtn = document.getElementById('resetDownloadBtn');
    const downloadBar = document.getElementById('downloadBar');
    const downloadText = document.getElementById('downloadText');
    const logEl = document.getElementById('log');

    const state = {
      uploadId: null,
      file: null,
      chunkSize: 1048576,
      totalChunks: 0,
      uploaded: new Set(),
      paused: false,
      running: false,
      sha256: null,
      simulateCorrupted: false,
      simulatedCorruptFired: false,
      downloadFileId: null,
      downloadTotal: 0,
      downloadReceived: 0,
      downloadParts: [],
      downloadPaused: false,
      downloading: false
    };

    function savedTask() {
      try {
        let raw = localStorage.getItem(storeKey);
        if (!raw) {
          // 兼容旧版本：把当前标签页里的任务记录迁移到 localStorage
          raw = sessionStorage.getItem(storeKey);
          if (raw) localStorage.setItem(storeKey, raw);
        }
        return JSON.parse(raw || 'null');
      } catch (e) {
        return null;
      }
    }

    function saveTask() {
      if (!state.uploadId) return;
      localStorage.setItem(storeKey, JSON.stringify({
        uploadId: state.uploadId,
        fileName: state.file.name,
        totalSize: state.file.size,
        sha256: state.sha256
      }));
    }

    function dropTask() {
      localStorage.removeItem(storeKey);
      sessionStorage.removeItem(storeKey);
    }

    function log(msg, cls) {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function fmt(n) {
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n / 1048576).toFixed(2) + ' MB';
      return (n / 1073741824).toFixed(2) + ' GB';
    }

    function updateProgress() {
      const done = state.uploaded.size;
      const total = state.totalChunks || 0;
      const pct = total ? Math.round(done * 100 / total) : 0;
      bar.style.width = pct + '%';
      progressText.textContent = total ? `${done}/${total} 片（${pct}%）` : '等待上传';
      taskText.textContent = 'uploadId：' + (state.uploadId ?? '-');
      mergeBtn.disabled = !state.uploadId || done !== total || total === 0;
    }

    async function sha256Blob(blob) {
      const buf = await blob.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function sha256Hex(file) {
      // 超大文件跳过浏览器端摘要（服务端合并后仍会校验）
      if (file.size > 200 * 1024 * 1024) return null;
      return sha256Blob(file);
    }

    async function postJson(url, body) {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return resp.json();
    }

    /** 页面打开时检查是否有未完成任务 */
    async function restoreTask() {
      const saved = savedTask();
      if (!saved) return;
      try {
        const json = await fetch(`${API}/uploads/${saved.uploadId}`).then(r => r.json());
        if (json.code !== 0) {
          log('上次任务已失效，已清除记录');
          dropTask();
          return;
        }
        state.uploadId = saved.uploadId;
        state.totalChunks = json.data.totalChunks;
        state.uploaded = new Set(json.data.uploaded);
        updateProgress();
        resumeBtn.disabled = false;
        resumeHint.textContent =
          `发现未完成任务：${saved.fileName}（${fmt(saved.totalSize)}），已传 ${json.data.uploadedChunks}/${json.data.totalChunks}。` +
          `请重新选择同一个文件，再点"刷新后续传"。`;
        log('发现未完成任务 uploadId=' + saved.uploadId + '，请选择同一个文件后续传');
      } catch (e) {
        log('查询上次任务失败：' + e.message, 'fail');
      }
    }

    fileInput.addEventListener('change', () => {
      state.file = fileInput.files[0] || null;
      startBtn.disabled = !state.file;
      resumeHint.textContent = '';

      const saved = savedTask();
      if (!state.file) return;
      log('已选择：' + state.file.name + '（' + fmt(state.file.size) + '）');

      if (saved) {
        const match = saved.fileName === state.file.name && saved.totalSize === state.file.size;
        resumeBtn.disabled = !match;
        if (match) {
          resumeHint.textContent = '文件与未完成任务匹配，可以点"刷新后续传"。';
        } else {
          resumeHint.textContent =
            `与未完成任务不一致：需要 ${saved.fileName}（${fmt(saved.totalSize)}），当前选的是 ${state.file.name}（${fmt(state.file.size)}）。`;
        }
      }
    });

    startBtn.addEventListener('click', async () => {
      if (!state.file) return;
      state.chunkSize = parseInt(chunkSelect.value, 10);
      state.uploaded = new Set();
      state.totalChunks = 0;
      state.uploadId = null;
      state.paused = false;
      state.simulatedCorruptFired = false;
      state.simulateCorrupted = simulateCorrupt.checked;
      dropTask();
      resetDownload();
      resultRow.style.display = 'none';
      updateProgress();

      startBtn.disabled = true;
      log('计算 SHA-256…');
      state.sha256 = await sha256Hex(state.file);
      if (state.sha256) log('SHA-256：' + state.sha256);

      const json = await postJson(API + '/uploads', {
        fileName: state.file.name,
        totalSize: state.file.size,
        sha256: state.sha256,
        chunkSize: state.chunkSize
      });
      if (json.code !== 0) { log('初始化失败：' + json.message, 'fail'); startBtn.disabled = false; return; }

      if (json.data.instant) {
        log('秒传命中：fileId=' + json.data.fileId, 'ok');
        showResult(json.data.fileId, state.sha256, null, state.file.size);
        startBtn.disabled = false;
        return;
      }

      state.uploadId = json.data.uploadId;
      state.totalChunks = json.data.totalChunks;
      saveTask();
      log(`任务已创建 uploadId=${state.uploadId}，共 ${state.totalChunks} 片`);
      updateProgress();
      await uploadLoop();
    });

    async function uploadLoop() {
      state.running = true;
      pauseBtn.disabled = false;
      pauseBtn.textContent = state.paused ? '继续' : '暂停';

      for (let i = 0; i < state.totalChunks; i++) {
        if (state.paused) { log('已暂停，完成分片 ' + state.uploaded.size + '/' + state.totalChunks); break; }
        if (state.uploaded.has(i)) continue;

        try {
          await uploadOneChunk(i);
          state.uploaded.add(i);
          log(`分片 ${i + 1}/${state.totalChunks} 上传成功`);
          updateProgress();
        } catch (e) {
          log('分片 ' + i + ' 失败：' + e.message + '（可点"继续"重试）', 'fail');
          state.paused = true;
          break;
        }
      }

      state.running = false;
      startBtn.disabled = false;
      // 只有全部传完才禁用暂停按钮；暂停状态下要能点"继续"
      pauseBtn.disabled = state.uploaded.size >= state.totalChunks && state.totalChunks > 0;
      pauseBtn.textContent = state.paused ? '继续' : '暂停';
      updateProgress();
      if (state.uploaded.size === state.totalChunks && state.totalChunks > 0) {
        log('全部分片上传完成，可以合并', 'ok');
      }
    }

    async function sendChunk(chunkIndex, advertisedSha256) {
      const start = chunkIndex * state.chunkSize;
      const end = Math.min(start + state.chunkSize, state.file.size);
      const blob = state.file.slice(start, end);
      const actualSha256 = await sha256Blob(blob);
      const resp = await fetch(`${API}/uploads/${state.uploadId}/chunks/${chunkIndex}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/octet-stream',
          'X-Chunk-SHA256': advertisedSha256 || actualSha256
        },
        body: blob
      });
      return { json: await resp.json(), actualSha256 };
    }

    async function uploadOneChunk(chunkIndex) {
      let advertisedSha256 = null;
      if (state.simulateCorrupted && chunkIndex === 1 && !state.simulatedCorruptFired) {
        advertisedSha256 = '0'.repeat(64);
        state.simulatedCorruptFired = true;
        log('演示：故意把第 2 片声明为错误 SHA-256', 'warn');
      }

      let result = await sendChunk(chunkIndex, advertisedSha256);
      if (result.json.code === 0) return;

      const retryChunks = result.json.data
        ? (result.json.data.retryChunks || result.json.data.invalidChunks || [])
        : [];
      if (result.json.code === 422 && retryChunks.includes(chunkIndex)) {
        log(`服务端通知分片 ${chunkIndex + 1} 损坏，正在自动重传`, 'warn');
        result = await sendChunk(chunkIndex, result.actualSha256);
        if (result.json.code === 0) {
          log(`分片 ${chunkIndex + 1} 重传成功`, 'ok');
          return;
        }
      }
      throw new Error(result.json.message || '分片上传失败');
    }

    pauseBtn.addEventListener('click', async () => {
      if (state.paused) {
        // 继续：从断点接着传
        state.paused = false;
        pauseBtn.textContent = '暂停';
        log('继续上传，剩余分片 ' + (state.totalChunks - state.uploaded.size));
        await uploadLoop();
      } else {
        // 暂停：当前这片传完后停止
        state.paused = true;
        pauseBtn.textContent = '暂停中…';
        log('正在暂停（当前分片完成后停止）');
      }
    });

    resumeBtn.addEventListener('click', async () => {
      const saved = savedTask();
      if (!saved) { log('没有可续传的任务'); return; }
      if (!state.file) {
        log(`请先选择文件：${saved.fileName}（${fmt(saved.totalSize)}）`, 'fail');
        resumeHint.textContent = `请先选择文件：${saved.fileName}（${fmt(saved.totalSize)}）`;
        return;
      }
      if (saved.fileName !== state.file.name || saved.totalSize !== state.file.size) {
        log('选择的文件与任务不一致，无法续传', 'fail');
        return;
      }
      const currentSha256 = await sha256Hex(state.file);
      if (saved.sha256 && currentSha256 && saved.sha256 !== currentSha256) {
        log('文件名和大小相同，但内容 SHA-256 不一致，无法续传', 'fail');
        resumeHint.textContent = '文件内容与未完成任务不一致，请选择原文件。';
        return;
      }
      state.sha256 = currentSha256 || saved.sha256;
      state.simulateCorrupted = simulateCorrupt.checked;
      state.simulatedCorruptFired = false;

      const json = await fetch(`${API}/uploads/${saved.uploadId}`).then(r => r.json());
      if (json.code !== 0) {
        log('任务不存在或已放弃：' + json.message, 'fail');
        dropTask();
        return;
      }

      state.uploadId = saved.uploadId;
      state.totalChunks = json.data.totalChunks;
      state.chunkSize = parseInt(chunkSelect.value, 10);
      state.uploaded = new Set(json.data.uploaded);
      state.paused = false;
      resumeHint.textContent = '';
      log(`已恢复任务 uploadId=${state.uploadId}，已传 ${state.uploaded.size}/${state.totalChunks}`);
      updateProgress();
      await uploadLoop();
    });

    mergeBtn.addEventListener('click', async () => {
      if (!state.uploadId) return;
      mergeBtn.disabled = true;
      log('正在合并分片…');
      const json = await postJson(`${API}/uploads/${state.uploadId}/merge`, { version: 0 });
      if (json.code !== 0) {
        const retryChunks = json.data && json.data.retryChunks ? json.data.retryChunks : [];
        if (retryChunks.length) {
          retryChunks.forEach(index => state.uploaded.delete(index));
          updateProgress();
          log('服务端要求重传分片：' + retryChunks.map(i => i + 1).join('、'), 'warn');
          await uploadLoop();
        }
        log('合并失败：' + json.message, 'fail');
        mergeBtn.disabled = false;
        return;
      }

      const same = state.sha256 && state.sha256 === json.data.sha256;
      log('合并完成：fileId=' + json.data.fileId + '，SHA-256=' + json.data.sha256, 'ok');
      log(same ? '校验通过：与本地 SHA-256 一致' : '请在本地核对 SHA-256', same ? 'ok' : '');
      showResult(json.data.fileId, json.data.sha256, json.data.path, json.data.size);
      dropTask();
      resumeBtn.disabled = true;
      resumeHint.textContent = '';
    });

    function showResult(fileId, sha256, path, size) {
      resetDownload(false);
      resultRow.style.display = 'flex';
      resultText.textContent = `fileId=${fileId}，SHA-256=${sha256 || '-'}，路径=${path || '-'}`;
      downloadLink.href = `${API}/files/${fileId}/content`;
      state.downloadFileId = fileId;
      state.downloadTotal = size || 0;
      downloadButtons.style.display = 'flex';
      downloadProgressRow.style.display = 'flex';
      downloadProgressBtn.disabled = false;
      updateDownloadProgress();
    }

    function updateDownloadProgress() {
      const total = state.downloadTotal || 0;
      const received = state.downloadReceived || 0;
      const pct = total ? Math.min(100, Math.round(received * 100 / total)) : 0;
      downloadBar.style.width = pct + '%';
      downloadText.textContent = total
        ? `${fmt(received)} / ${fmt(total)}（${pct}%）`
        : '等待下载';
      const complete = total > 0 && received >= total;
      pauseDownloadBtn.disabled = !state.downloading || state.downloadPaused || complete;
      pauseDownloadBtn.textContent = state.downloadPaused ? '已暂停' : '暂停下载';
      downloadProgressBtn.textContent = complete ? '重新下载' : '开始 / 继续下载';
    }

    async function startOrResumeDownload() {
      if (!state.downloadFileId || state.downloadTotal <= 0) {
        log('暂无可下载文件', 'fail');
        return;
      }
      if (state.downloadReceived >= state.downloadTotal) {
        state.downloadReceived = 0;
        state.downloadParts = [];
      }
      if (state.downloading) return;

      state.downloading = true;
      state.downloadPaused = false;
      updateDownloadProgress();
      log('开始断点下载，从字节 ' + state.downloadReceived + ' 继续');

      try {
        while (state.downloadReceived < state.downloadTotal) {
          if (state.downloadPaused) {
            log('下载已暂停，已接收 ' + fmt(state.downloadReceived), 'warn');
            break;
          }
          const start = state.downloadReceived;
          const end = Math.min(start + 1024 * 1024 - 1, state.downloadTotal - 1);
          const response = await fetch(
            `${API}/files/${state.downloadFileId}/content`,
            { headers: { Range: `bytes=${start}-${end}` } }
          );
          if (response.status !== 206) {
            throw new Error('服务端未返回 206，状态码=' + response.status);
          }
          const bytes = await response.arrayBuffer();
          if (!bytes.byteLength) break;
          state.downloadParts.push(new Uint8Array(bytes));
          state.downloadReceived += bytes.byteLength;
          updateDownloadProgress();
        }

        if (state.downloadReceived >= state.downloadTotal) {
          const blob = new Blob(state.downloadParts, { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = state.file ? state.file.name : 'download';
          anchor.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          log('下载完成，文件大小=' + fmt(state.downloadTotal), 'ok');
        }
      } catch (e) {
        state.downloadPaused = true;
        log('下载失败，可稍后继续：' + e.message, 'fail');
      } finally {
        state.downloading = false;
        updateDownloadProgress();
      }
    }

    downloadProgressBtn.addEventListener('click', startOrResumeDownload);

    pauseDownloadBtn.addEventListener('click', () => {
      if (!state.downloading) return;
      state.downloadPaused = true;
      pauseDownloadBtn.disabled = true;
      log('正在暂停下载（当前 1 MB 数据块完成后停止）');
    });

    resetDownloadBtn.addEventListener('click', () => {
      if (state.downloading) {
        state.downloadPaused = true;
        log('请等待当前 1 MB 数据块结束后再重置', 'warn');
        return;
      }
      resetDownload(true);
    });

    function resetDownload(hidePanel) {
      state.downloadReceived = 0;
      state.downloadParts = [];
      state.downloadPaused = false;
      state.downloading = false;
      updateDownloadProgress();
      if (hidePanel) {
        downloadButtons.style.display = 'none';
        downloadProgressRow.style.display = 'none';
      }
    }

    concurrentBtn.addEventListener('click', async () => {
      if (!state.downloadFileId || state.downloadTotal <= 0) {
        log('请先完成一个文件上传再测试并发下载', 'fail');
        return;
      }
      const probeSize = Math.min(1024 * 1024, Math.max(1, Math.floor(state.downloadTotal / 3)));
      const starts = [0, Math.floor(state.downloadTotal / 3), Math.floor(state.downloadTotal * 2 / 3)];
      log('同时发起 3 个 Range 下载请求…');
      try {
        const results = await Promise.all(starts.map(async (start, index) => {
          const end = Math.min(start + probeSize - 1, state.downloadTotal - 1);
          const response = await fetch(
            `${API}/files/${state.downloadFileId}/content`,
            { headers: { Range: `bytes=${start}-${end}` } }
          );
          const data = await response.arrayBuffer();
          return `请求${index + 1}: HTTP ${response.status}, ${data.byteLength} 字节`;
        }));
        results.forEach(result => log(result, 'ok'));
        log('三路并发下载全部完成', 'ok');
      } catch (e) {
        log('并发下载测试失败：' + e.message, 'fail');
      }
    });

    clearBtn.addEventListener('click', async () => {
      const saved = savedTask();
      if (saved) {
        try {
          await fetch(`${API}/uploads/${saved.uploadId}`, { method: 'DELETE' });
          log('已放弃任务 uploadId=' + saved.uploadId + '，分片已清理');
        } catch (e) {
          log('放弃任务失败：' + e.message, 'fail');
        }
      }
      dropTask();
      state.uploadId = null;
      state.uploaded = new Set();
      state.totalChunks = 0;
      resultRow.style.display = 'none';
      resetDownload(true);
      resumeHint.textContent = '';
      resumeBtn.disabled = true;
      updateProgress();
    });

    updateProgress();
    restoreTask();
  </script>
</body>
</html>
