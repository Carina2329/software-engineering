upstream contest_backend {
    server host.docker.internal:8080;
    keepalive 32;
}

upstream contest_frontend {
    server host.docker.internal:5173;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 组员 A 只允许在敏感认证 location 上增加限流，不得全站一刀切。
    client_max_body_size 2g;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @auth_rate_limited;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nginx 直接拒绝时使用与后端一致的数字业务码和真实 request_id。
    location @auth_rate_limited {
        internal;
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header X-Trace-Id $request_id always;
        return 429 '{"code":40001,"message":"请求过于频繁，请稍后再试","data":null,"trace_id":"$request_id"}';
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_login_rate burst=10 nodelay;
        limit_conn auth_login_conn 10;

        proxy_pass http://contest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location = /api/v1/auth/captcha {
        limit_req zone=auth_captcha_rate burst=20 nodelay;
        limit_conn auth_captcha_conn 10;

        proxy_pass http://contest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location = /api/v1/auth/email-verification-codes {
        limit_req zone=auth_email_otp_rate burst=10 nodelay;
        limit_conn auth_email_otp_conn 5;

        proxy_pass http://contest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location = /api/v1/auth/password-reset/request {
        limit_req zone=auth_password_reset_rate burst=10 nodelay;
        limit_conn auth_password_reset_conn 5;

        proxy_pass http://contest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://contest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://contest_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
