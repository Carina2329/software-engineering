worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 仅敏感认证接口使用以下限流域，普通页面、业务 API 和文件接口不引用。
    limit_req_zone $binary_remote_addr zone=auth_login_rate:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=auth_captcha_rate:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth_email_otp_rate:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_password_reset_rate:10m rate=30r/m;

    limit_conn_zone $binary_remote_addr zone=auth_login_conn:10m;
    limit_conn_zone $binary_remote_addr zone=auth_captcha_conn:10m;
    limit_conn_zone $binary_remote_addr zone=auth_email_otp_conn:10m;
    limit_conn_zone $binary_remote_addr zone=auth_password_reset_conn:10m;

    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
